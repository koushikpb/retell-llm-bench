name: change-mind-before-booking
description: Caller asks to book, then 200 ms later says not to; a fast tool can commit before the supersede arrives (api-notes §8), so a failure here shows the trap rather than a bench bug.
turns:
  - user: "Book me for September 23rd at 10am."
    interrupt:
      after_ms: 200
      user: "Wait, no, don't book anything yet, I need to check with my wife first."
expect:
  tool_calls: []
  forbidden_tools: [book_appointment, end_call]
  must_complete: true
  agent_transcript:
    - "No problem, I will hold off. Call back whenever you are ready."
